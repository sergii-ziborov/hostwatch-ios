name: Hostwatch
options:
  bundleIdPrefix: com.hostwatch
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
targets:
  Hostwatch:
    type: application
    platform: iOS
    sources:
      - Hostwatch
    resources:
      - Hostwatch/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hostwatch.controlplane
        PRODUCT_NAME: Hostwatch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: XMS5ZC28UJ
    info:
      path: Hostwatch/Info.plist
      properties:
        CFBundleDisplayName: Hostwatch
        NSCameraUsageDescription: Scan a one-time Hostwatch sign-in QR code shown on your other device.
        NSFaceIDUsageDescription: Confirm that you approve a Hostwatch sign-in on another device.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  HostwatchTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - HostwatchTests
    dependencies:
      - target: Hostwatch
schemes:
  Hostwatch:
    build:
      targets:
        Hostwatch: all
        HostwatchTests: [test]
    run:
      config: Debug
    test:
      targets:
        - HostwatchTests
    archive:
      config: Release
