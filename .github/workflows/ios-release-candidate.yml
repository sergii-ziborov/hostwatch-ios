name: iOS release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Check the stable Xcode version
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep iphoneos
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build unsigned App Store archive
        run: |
          xcodebuild -project Hostwatch.xcodeproj -scheme Hostwatch \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Hostwatch.xcarchive" \
            CODE_SIGNING_ALLOWED=NO archive
      - name: Package archive for local signing
        run: ditto -c -k --keepParent "$RUNNER_TEMP/Hostwatch.xcarchive" "$RUNNER_TEMP/Hostwatch.xcarchive.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: hostwatch-ios-unsigned-archive
          path: ${{ runner.temp }}/Hostwatch.xcarchive.zip
          retention-days: 3
